name: iOS IPA (unsigned per AltStore)

on:
  workflow_dispatch:   # si lancia manualmente da GitHub
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Rimuovi entitlement MusicKit (non firmabile con Apple ID gratuito)
        run: |
          sed -i '' '/CODE_SIGN_ENTITLEMENTS/d' ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig

      - name: Build iOS senza firma
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          rm -rf Payload app.ipa
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry app.ipa Payload
          mkdir -p build/ios/ipa
          cp app.ipa build/ios/ipa/MusicDownloader-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-unsigned-ipa
          path: mobile/build/ios/ipa/*.ipa
          retention-days: 30
