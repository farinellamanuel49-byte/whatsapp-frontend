workflows:
  ios-altstore:
    name: iOS IPA (unsigned per AltStore)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - sync_config   # SYNC_SERVER_URL e SYNC_TOKEN del Pi
    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Rimuovi entitlement MusicKit (non firmabile con Apple ID gratuito)
        script: |
          sed -i '' '/CODE_SIGN_ENTITLEMENTS/d' ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig
      - name: Build iOS senza firma
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=SYNC_SERVER_URL="${SYNC_SERVER_URL:-http://5.134.123.152:8787}" \
            --dart-define=SYNC_TOKEN="${SYNC_TOKEN:-RXzDPp5ucM7VQhM0NK4mUycBDgWlq9l7}" \
            --dart-define=COBALT_URL="${COBALT_URL:-https://82.223.13.114.sslip.io}" \
            --dart-define=COBALT_API_KEY="${COBALT_API_KEY:-290f64f0a911460ea83fcd9668d2e93a0ab67030e44742998f42c69bbfac614e}"
      - name: Package IPA
        script: |
          rm -rf Payload app.ipa
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry app.ipa Payload
          mkdir -p build/ios/ipa
          cp app.ipa build/ios/ipa/MusicDownloader-unsigned.ipa
    artifacts:
      - build/ios/ipa/*.ipa
