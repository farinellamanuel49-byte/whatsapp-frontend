workflows:
  ios-altstore:
    name: iOS IPA (unsigned per AltStore)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Rimuovi entitlement MusicKit (non firmabile con Apple ID gratuito)
        script: |
          sed -i '' '/CODE_SIGN_ENTITLEMENTS/d' ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig
      - name: Build iOS senza firma
        script: |
          flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          rm -rf Payload app.ipa
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry app.ipa Payload
          mkdir -p build/ios/ipa
          cp app.ipa build/ios/ipa/MusicDownloader-unsigned.ipa
    artifacts:
      - build/ios/ipa/*.ipa

  ios-release:
    name: iOS IPA Release (firmato - richiede Apple Developer)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: mobile
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APP_ID: ""
    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Install pods
        script: |
          cd ios && pod install --repo-update
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
